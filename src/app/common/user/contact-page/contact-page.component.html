<div class="container mt-4">
  <!-- Back Button -->
  <button (click)="goBack()" class="btn btn-outline-primary btn-sm mb-3">
    <i class="fa-solid fa-angle-left"></i> Back
  </button>
<div class="profile-page  " *ngIf="!loading">

  <div class="card profile-card ">
    <div class="card-body">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center">
          <div class="avatar-circle me-3">{{ firstLetter }}</div>
          <h3 class="mb-0 text-primary profile-title text-center">
            Emergency Contacts
          </h3>
        </div>
    
        <div>
          <button class="btn btn-primary m-3" (click)="openAddModal()">
            Add Emergency Contact
          </button>
        </div>
      </div>

      <!-- Empty state -->
      <div *ngIf="contacts.length === 0" class="section mb-4 text-center p-4">
        <p>No emergency contacts found.</p>
      </div>

      <!-- Contacts list -->
      <div *ngFor="let contact of contacts; let i = index" class="section mb-4 item-box position-relative">
        <!-- Top-right actions -->
        <div class="position-absolute top-0 end-0 p-2 d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" (click)="openEditModal(contact)">
            Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="confirmDelete(contact.id)">
            Delete
          </button>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label small text-primary">NAME</label>
            <input class="form-control readonly-input" [value]="fullName(contact)" readonly />
          </div>

          <div class="col-md-4">
            <label class="form-label small text-primary">RELATIONSHIP</label>
            <input class="form-control readonly-input" [value]="contact.relationshipType || '-'" readonly />
          </div>
        </div>

        <!-- Telecoms -->
        <div class="mt-3" *ngIf="contact.contactTelecoms?.length > 0">
          <h6 class="text-primary mb-2">Telecom</h6>
          <div *ngFor="let tel of contact.contactTelecoms" class="inner p-2 mb-2">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small text-primary">SYSTEM</label>
                <input class="form-control readonly-input" [value]="tel.system || '-'" readonly />
              </div>
              <div class="col-md-4">
                <label class="form-label small text-primary">VALUE</label>
                <input class="form-control readonly-input" [value]="tel.value || '-'" readonly />
              </div>
            </div>
          </div>
        </div>

        <!-- Addresses -->
        <div class="mt-3" *ngIf="contact.contactAddresses?.length > 0">
          <h6 class="text-primary mb-2">Address</h6>
          <div *ngFor="let addr of contact.contactAddresses" class="inner p-2 mb-2">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small text-primary">ADDRESS</label>
                <input class="form-control readonly-input" [value]="addr.text || combinedAddress(addr)" readonly />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-primary">CITY</label>
                <input class="form-control readonly-input" [value]="addr.city || '-'" readonly />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-primary">STATE</label>
                <input class="form-control readonly-input" [value]="addr.state || '-'" readonly />
              </div>
            </div>
            <div class="row g-3 mt-2">
              <div class="col-md-3">
                <label class="form-label small text-primary">COUNTRY</label>
                <input class="form-control readonly-input" [value]="addr.country || '-'" readonly />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-primary">PINCODE</label>
                <input class="form-control readonly-input" [value]="addr.postalCode || '-'" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="loading" class="text-center p-5">Loading...</div>

      <!-- Modal (reuses same modal for both) -->
      <div class="modal fade" id="editContactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">
                {{
                isEditMode
                ? "Edit Emergency Contact"
                : "Add Emergency Contact"
                }}
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
              <!-- Reactive modal form -->
              <form [formGroup]="contactForm">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">First Name</label>
                    <input class="form-control" formControlName="firstName" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Middle Name</label>
                    <input class="form-control" formControlName="middleName" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Last Name</label>
                    <input class="form-control" formControlName="lastName" />
                  </div>
                </div>

                <div class="mt-3">
                  <label class="form-label">Relationship Type</label>
                  <select class="form-select" formControlName="relationshipType">
                    <option value="">Select</option>
                    <option *ngFor="let r of relationshipOptions" [value]="r">
                      {{ r }}
                    </option>
                  </select>
                </div>

                <hr />

                <!-- Telecoms -->
                <div formArrayName="contactTelecoms">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0">Telecom</h6>
                    <button class="btn btn-outline-primary" type="button" (click)="addTelecom()">
                      <i class="fa fa-plus"></i>
                    </button>
                  </div>

                  <div *ngFor="let tel of telecoms.controls; let ti = index" [formGroupName]="ti"
                    class="mb-3 border rounded p-3">
                    <div class="row g-3">
                      <div class="col-md-4">
                        <label class="form-label fw-semibold">Contact System</label>
                        <select class="form-select" formControlName="system">
                          <option value="phone">Phone</option>
                          <option value="email">Email</option>
                          <option value="whatsapp">WhatsApp</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">Value</label>
                        <input class="form-control" formControlName="value" placeholder="e.g. +91 9999999999" />
                      </div>
                      <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-outline-danger w-100" type="button" (click)="removeTelecom(ti)"
                          *ngIf="telecoms.length > 1">
                          Remove
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <hr />

                <!-- Addresses -->
                <!-- Addresses -->
                <div formArrayName="contactAddresses">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0">Addresses</h6>
                    <button class="btn btn-outline-primary" type="button" (click)="addAddress()">
                      <i class="fa fa-plus"></i>
                    </button>
                  </div>

                  <div class="scroll-section">
                    <div *ngFor="let addr of addresses.controls; let ai = index" [formGroupName]="ai"
                      class="mb-3 border rounded p-3 position-relative">
                      <div class="row">
                        <!-- text -->
                        <div class="col-md-6 mb-3">
                          <label>Address Text</label>
                          <input class="form-control" formControlName="text" />
                        </div>

                        <!-- useCode -->
                        <div class="col-md-6 mb-3">
                          <label>Address Use</label>
                          <select class="form-select" formControlName="useCode">
                            <option value="">Select</option>
                            <option value="home">Home</option>
                            <option value="work">Work</option>
                            <option value="temp">Temp</option>
                            <option value="old">Old</option>
                            <option value="billing">Billing</option>
                          </select>
                        </div>

                        <!-- city -->
                        <div class="col-md-6 mb-3 position-relative">
                          <label>City</label>
                          <input class="form-control" formControlName="city" (focus)="showCity[ai] = true"
                            (input)="showCity[ai] = true" (blur)="hideDropdownLater(ai, 'city')" />

                          <ul *ngIf="showCity[ai]" class="list-group position-absolute w-100" style="
                              z-index: 1100;
                              max-height: 200px;
                              overflow-y: auto;
                            ">
                            <li class="list-group-item" *ngFor="let c of filteredCities[ai]"
                              (mousedown)="selectCity(ai, c)">
                              {{ c }}
                            </li>
                            <li class="list-group-item text-muted" *ngIf="
                                !filteredCities[ai] ||
                                filteredCities[ai].length === 0
                              ">
                              No results
                            </li>
                          </ul>
                        </div>

                        <!-- state -->
                        <div class="col-md-6 mb-3 position-relative">
                          <label>State</label>
                          <input class="form-control" formControlName="state" (focus)="showState[ai] = true"
                            (input)="showState[ai] = true" (blur)="hideDropdownLater(ai, 'state')" />

                          <ul *ngIf="showState[ai]" class="list-group position-absolute w-100" style="
                              z-index: 1100;
                              max-height: 200px;
                              overflow-y: auto;
                            ">
                            <li class="list-group-item" *ngFor="let s of filteredStates[ai]"
                              (mousedown)="selectState(ai, s)">
                              {{ s }}
                            </li>
                            <li class="list-group-item text-muted" *ngIf="
                                !filteredStates[ai] ||
                                filteredStates[ai].length === 0
                              ">
                              No results
                            </li>
                          </ul>
                        </div>

                        <!-- postalCode -->
                        <div class="col-md-6 mb-3">
                          <label>Postal Code</label>
                          <input class="form-control" formControlName="postalCode" readonly />
                        </div>

                        <!-- country -->
                        <div class="col-md-6 mb-3 position-relative">
                          <label>Country</label>
                          <input class="form-control" formControlName="country" (focus)="showCountry[ai] = true"
                            (input)="showCountry[ai] = true" (blur)="hideDropdownLater(ai, 'country')" />

                          <ul *ngIf="showCountry[ai]" class="list-group position-absolute w-100" style="
                              z-index: 1100;
                              max-height: 200px;
                              overflow-y: auto;
                            ">
                            <li class="list-group-item" *ngFor="let c of filteredCountries[ai]"
                              (mousedown)="selectCountry(ai, c)">
                              {{ c }}
                            </li>
                            <li class="list-group-item text-muted" *ngIf="
                                !filteredCountries[ai] ||
                                filteredCountries[ai].length === 0
                              ">
                              No results
                            </li>
                          </ul>
                        </div>
                      </div>

                      <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeAddress(ai)"
                        *ngIf="addresses.length > 1">
                        Remove
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">
                Cancel
              </button>
              <button class="btn btn-primary" (click)="saveModal()" type="button">
                Save
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- end modal -->
    </div>
  </div>
</div>
</div>
