<div *ngIf="loading">Loading...</div>
<div *ngIf="!loading">
  <div *ngIf="hasPrescriptions">
    <app-daily-medicines  [pageContext]="'HOME'"></app-daily-medicines>
    <div class="row d-flex ">
      <div class="col card m-3 shadow-sm text-center" style=" border-radius: 12px;">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
          <h5 class="card-title mb-3">View Prescriptions</h5>
          <a [routerLink]="['/medications/view-prescription']" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-angle-right"></i>
          </a>

        </div>
      </div>
      <div class="col card m-3 shadow-sm text-center" style="border-radius: 12px;">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
          <h5 class="card-title mb-3">View Laboratory Reports</h5>
          <a [routerLink]="['/lab-tests/view-tests']" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-angle-right"></i>
          </a>

        </div>
      </div>
    </div>

  </div>
  <div *ngIf="!hasPrescriptions">
    <div class="row d-flex ">
      <div class="card m-3" style="width: 18rem;">
        <div class="card-body">
          <h5 class="card-title">Add Medications</h5>
          <p class="card-text">No medications found. Add medications.</p>
          <a [routerLink]="['/add-medication']" class="btn btn-primary">Add</a>
        </div>


      </div>

    </div>
  </div>
</div>
