<div *ngIf="loading">Loading...</div>
<div *ngIf="!loading">
  <div
    *ngIf="!hasPrescriptions"
    class="d-flex align-items-center justify-content-center"
  >
    <div class="full-card-content text-center">
      <!-- Illustration -->
      <img
        src="assets/image.webp"
        class="empty-image mb-4"
        alt="No medications"
      />

      <!-- Title -->
      <h2 class="fw-bold">Your Health Journey Starts Here</h2>

      <!-- Message -->
      <p class="text-muted fs-5 mb-4">
        Take control of your wellbeing! Add your first medication to stay on top
        of your health, or check the data of someone you care for as an
        emergency contact.
      </p>

      <div class="row g-2 mt-3">
        <!-- Primary Button (Left) -->
        <div class="col-12 col-md-6">
          <a
            [routerLink]="['/add-medication']"
            class="btn btn-outline-primary btn-sm w-100"
          >
            <i class="fa-solid fa-plus me-2"></i> Add Medication
          </a>
        </div>

        <!-- Secondary Button (Right) -->
        <div class="col-12 col-md-6">
          <a
            [routerLink]="['/health-data']"
            class="btn btn-outline-primary btn-sm w-100"
          >
            <i class="fa-solid fa-user-shield me-2"></i> View Emergency
            Contact’s Health Data
          </a>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="hasPrescriptions">
    <app-daily-medicines [pageContext]="'HOME'"></app-daily-medicines>
    <div class="row d-flex">
      <div
        class="col card m-3 shadow-sm text-center"
        style="border-radius: 12px"
      >
        <div
          class="card-body d-flex flex-column align-items-center justify-content-center"
        >
          <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
          <h5 class="card-title mb-3">View Prescriptions</h5>
          <a
            [routerLink]="['/medications/view-prescription']"
            class="btn btn-primary btn-sm"
          >
            <i class="fa-solid fa-angle-right"></i>
          </a>
        </div>
      </div>
      <div
        class="col card m-3 shadow-sm text-center"
        style="border-radius: 12px"
      >
        <div
          class="card-body d-flex flex-column align-items-center justify-content-center"
        >
          <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
          <h5 class="card-title mb-3">Shared Health Data</h5>
          <a
            [routerLink]="['/user/sharePrescription']"
            class="btn btn-primary btn-sm"
          >
            <i class="fa-solid fa-angle-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
