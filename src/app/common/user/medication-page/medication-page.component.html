<div class="container mt-4">
  <app-daily-medicines  [pageContext]="'MEDICATION'"></app-daily-medicines>
<div class="row g-3 mt-4">
  <!-- View Prescriptions Card -->
  <div class="col-12 custom-col-lg">
    <div class="card m-0 shadow-sm text-center" style="border-radius: 12px;">
      <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
        <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
        <h5 class="card-title mb-3">View Prescriptions</h5>
        <a [routerLink]="['view-prescription']" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Download Health Data (FHIR) Card -->
  <div class="col-12 custom-col-lg">
    <div class="card m-0 shadow-sm text-center" style="border-radius: 12px;">
      <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
        <i class="bi bi-file-medical fs-1 text-primary mb-3"></i>
        <h5 class="card-title mb-3">Download Health Data (FHIR)</h5>
        <a [routerLink]="['export-fhir']" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Add Prescription Card -->
  <div class="col-12 custom-col-lg">
    <div class="card m-0 shadow-sm text-center" style="border-radius: 12px;">
      <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
        <i class="bi bi-plus-circle fs-1 text-primary mb-3"></i>
        <h5 class="card-title mb-3">Add Prescription</h5>
        <a [routerLink]="['/user/add-medication']" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </div>
    </div>
  </div>
</div>

</div>
