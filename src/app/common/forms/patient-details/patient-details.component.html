<div class="display-root">
  <div class="display-card shadow-lg">
    <div class="p-2">
      <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="m-4">
        <h3 class="text-primary text-center mb-4 fw-bold">Patient Details</h3>
        <div *ngIf="currentStep === 1">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label text-primary fw-semibold required">Birth Date</label>
              <div class="input-group">
                <input type="date" class="form-control" formControlName="birthDate"
                  [appErrorTooltip]="patientForm.get('birthDate')" [max]="today" />
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-primary fw-semibold required">Gender</label>
              <div class="input-group">
                <select class="form-select" formControlName="gender" [appErrorTooltip]="patientForm.get('gender')">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-primary fw-semibold required">Marital Status</label>
              <div class="input-group">
                <select class="form-select" formControlName="maritalStatus"
                  [appErrorTooltip]="patientForm.get('maritalStatus')">
                  <option value="unmarried">Unmarried</option>
                  <option value="Married">Married</option>
                  <option value="Widowed">Widowed</option>
                  <option value="unknown">unknown</option>
                  <option value="NeverMarried">NeverMarried</option>
                  <option value="Annulled">Annulled</option>
                  <option value="Divorced">Divorced</option>
                  <option value="Interlocutory">Interlocutory</option>
                  <option value="LegallySeparated">LegallySeparated</option>
                  <option value="CommonLaw">CommonLaw</option>
                  <option value="Polygamous">Polygamous</option>
                  <option value="Domesticpartner">Domesticpartner</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="currentStep === 2" formArrayName="addresses">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-primary mb-0">Addresses</h4>
            <button type="button" class="btn btn-outline-primary" (click)="addAddress()">
              <i class="fa fa-plus"></i>
            </button>
          </div>
          <div class="scroll-section">
            <div *ngFor="let address of addresses.controls; let i = index" [formGroupName]="i"
              class="mb-3 border rounded p-3">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="required">Address Use</label>
                  <div class="input-group">
                    <select class="form-select" formControlName="useCode" [appErrorTooltip]="address.get('useCode')">
                      <option value="home">Home</option>
                      <option value="work">Work</option>
                      <option value="temp">Temp</option>
                      <option value="old">Old</option>
                      <option value="billing">Billing</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="required">Address Type</label>
                  <div class="input-group">
                    <select class="form-select" formControlName="addressType"
                      [appErrorTooltip]="address.get('addressType')">
                      <option value="">Select</option>
                      <option value="postal">Postal</option>
                      <option value="physical">Physical</option>
                      <option value="both">Both</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="required">Address Text</label>
                  <div class="input-group">
                    <input class="form-control" formControlName="text" [appErrorTooltip]="address.get('text')" />
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="required">Country</label>
                  <div class="input-group">
                    <select class="form-select" formControlName="country" [appErrorTooltip]="address.get('country')"
                      (change)="onCountryChange(i)">

                      <option value="India">India</option>
                      <option value="USA">United States</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="required">Postal Code</label>
                    <div class="input-group">

                      <input class="form-control" formControlName="postalCode"
                        [appErrorTooltip]="address.get('postalCode')" />
                    </div>
                  </div>

                </div>
                <div class="col-md-6 mb-3 position-relative">
                  <label class="required">City</label>
                  <div class="input-group">
                    <input class="form-control" formControlName="city" readonly
                      [appErrorTooltip]="address.get('city')" />

                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="required">State</label>
                  <div class="input-group">
                    <input class="form-control" formControlName="state" readonly
                      [appErrorTooltip]="address.get('state')" />

                  </div>
                </div>

              </div>
              <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeAddress(i)"
                *ngIf="addresses.length > 1">
                Remove
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="currentStep === 3" formArrayName="telecoms">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-primary mb-0">Telecom</h4>
            <button type="button" class="btn btn-outline-primary" (click)="addTelecom()">
              <i class="fa fa-plus"></i>
            </button>
          </div>
          <div class="scroll-section">
            <div *ngFor="let telecom of telecoms.controls; let i = index" [formGroupName]="i"
              class="mb-3 border rounded p-3">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold required">Contact Use</label>
                  <div class="input-group">
                    <select class="form-select" formControlName="useCode" [appErrorTooltip]="telecom.get('useCode')">
                      <option value="home">Home</option>
                      <option value="work">Work</option>
                      <option value="temp">Temp</option>
                      <option value="old">Old</option>
                      <option value="mobile">Mobile</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold required">Value</label>
                  <div class="input-group">
                    <input class="form-control" formControlName="value" placeholder="eg 9876543219"
                      [appErrorTooltip]="telecom.get('value')" />
                  </div>
                </div>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeTelecom(i)"
                  *ngIf="telecoms.length > 1">
                  <i class="fa fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-secondary" (click)="previousStep()" *ngIf="!(currentStep === 1)">
            Previous
          </button>
          <button type="button" class="btn btn-primary" *ngIf="currentStep < maxStep" (click)="nextStep()">
            Next
          </button>
          <button type="submit" class="btn btn-success" *ngIf="currentStep === maxStep" [disabled]="!patientForm.valid">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
