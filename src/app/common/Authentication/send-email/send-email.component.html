
<div class="p-4">
  <form (ngSubmit)="onSubmit()"[formGroup]="mailForm" >
  
  <h3 class="text-primary text-center mb-4 fw-bold">Reset Password</h3>
  <div class="mb-3">
    <label class="form-label text-primary fw-semibold">Enter your email address we will send you a link to reset password </label>
    <input type="email" class="form-control" formControlName="email" name="email" required>
  </div>
  
  <button class="btn btn-primary w-100 fw-bold" type="submit">Submit</button>


<p *ngIf="successMessage && formSubmit" class="text-success mt-3">
  {{ successMessage }}
</p>

<p *ngIf="errorMessage && formSubmit" class="text-danger mt-3">
  {{ errorMessage }}
</p>

</form>
</div>
