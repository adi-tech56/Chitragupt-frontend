<div class="auth-root">
  <div class="auth-card shadow-lg">
<div class="p-4">
  <form (ngSubmit)="onSubmit()"[formGroup]="resetForm" >
  
  <h3 class="text-primary text-center mb-4 fw-bold">Update Password</h3>
   <div class="col-md-6 mb-3">
        <label for="password" class="form-label text-primary fw-semibold">Password</label>
        <input id="password" type="password" name="password" class="form-control" formControlName="password" />
      </div>

      <div class="col-md-6 mb-3">
        <label for="confirm-password" class="form-label text-primary fw-semibold">Confirm Password</label>
        <input id="confirm-password" class="form-control" type="password" name="confirm-password"
          formControlName="confirmPassword" />
      </div>
  <p *ngIf="resetForm?.errors?.['valuesNotEqual'] && resetForm.touched" class="text-danger">
      Passwords do not match.
    </p>
  <button class="btn btn-primary w-100 fw-bold" type="submit">Submit</button>



    
  
</form>
</div>
  </div>
</div>
