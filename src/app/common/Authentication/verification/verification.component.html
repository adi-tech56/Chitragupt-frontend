<div class="p-4">
<form (ngSubmit)="verifyOtp()" [formGroup]="otpForm">
    <h3 class="text-primary text-center mb-4 fw-bold">Verify OTP</h3>
    <div class="mb-3">
        <label class="form-label text-primary fw-semibold">Enter OTP</label>

        <div formArrayName="otp"  class="d-flex justify-content-center gap-2">
         
            <input *ngFor="let c of otpControls;let i = index"
           
            type="text"
            class="otp-input-bs form-control" maxlength="1" [formControlName]="i"
           (input)="moveNext($event,i)" (keydown) = "moveNext($event,i)"/>
        </div>
    </div>
  

<div class="text-center">
    <!-- Timer Display Area -->
    <!-- Use *ngIf to show/hide elements based on component state -->
    <p *ngIf="isTimerActive" class="text-muted">
        Resend code in: {{ formattedTime }}
    </p>
    
    <!-- Resend Button (Hidden initially) -->
    <button *ngIf="!isTimerActive" (click)="resendOtp()" class="btn btn-link">
        Resend OTP
    </button>
</div>
    <button class="btn btn-primary w-100 fw-bold" type="submit">Verify</button>
</form>
</div>
