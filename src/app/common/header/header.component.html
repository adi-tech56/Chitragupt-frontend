<header class="header-container">
  <div class="header-left">
    <span class="app-title">Chitragupt</span>
  </div>

  <div class="header-right">
    <button
      class="icon-btn"
      aria-label="Profile"
      (click)="goToProfile()">
      <i class="fas fa-user"></i>
    </button>

    <button
      class="icon-btn logout-btn"
      aria-label="Logout"
      (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </div>
</header>
